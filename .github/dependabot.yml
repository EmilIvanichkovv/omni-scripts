version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Generated by dist: bumping its actions makes `dist plan` fail on drift. Upgrade dist and
    # regenerate instead.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    # One PR for compatible bumps; major bumps still get their own PR each.
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

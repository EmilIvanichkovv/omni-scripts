name: CI

# PRs only: a merged PR already passed these checks, so pushes to main do not rerun them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every job runs through the flake's dev shell so CI uses the exact toolchain pinned in
# flake.lock -- the same rustc/clippy/prettier that the local pre-commit hook uses.
jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Pulls from the cache, and pushes everything the job builds when the token is available
      # (it is not exposed to fork PRs, which then only read).
      - uses: cachix/cachix-action@v17
        with:
          name: git-branch-manager
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/Cargo.lock') }}
          restore-keys: cargo-lint-${{ runner.os }}-

      # Runs cargo fmt, clippy -D warnings, prettier, markdownlint and the yaml/toml/whitespace
      # checks. Hooks that rewrite files fail the run and the diff is printed.
      - name: Run pre-commit hooks
        run: nix develop --command pre-commit run --all-files --show-diff-on-failure

      # Non-Nix builds (native test runners, dist release builds) use rust-toolchain.toml.
      - name: Check rust-toolchain.toml matches the flake's rustc
        run: |
          want=$(nix develop --command rustc --version | awk '{print $2}')
          have=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ "$want" != "$have" ]; then
            echo "::error file=rust-toolchain.toml::channel is $have, flake.lock pins rustc $want"
            exit 1
          fi

  # PRs are rebase-merged, so every PR commit lands on main and feeds the release version.
  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check Conventional Commits subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! scripts/check-commit-message.sh "$RUNNER_TEMP/message"; then
              echo "::error::Commit ${sha:0:7} does not follow Conventional Commits"
              status=1
            fi
          done
          exit "$status"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Pulls from the cache, and pushes everything the job builds when the token is available
      # (it is not exposed to fork PRs, which then only read).
      - uses: cachix/cachix-action@v17
        with:
          name: git-branch-manager
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Rust tests
        run: nix develop --command bash -c "cd rust && cargo test --workspace --all-features"

      - name: Bash tests (bats)
        run: nix develop --command bats --recursive bash

  build:
    name: Nix build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Pulls from the cache, and pushes everything the job builds when the token is available
      # (it is not exposed to fork PRs, which then only read).
      - uses: cachix/cachix-action@v17
        with:
          name: git-branch-manager
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Not `nix flake check`: its only check is the pre-commit run, which the lint job already
      # does with an incremental cargo cache instead of a cold sandbox build.
      - name: Build packages
        run: nix build --print-build-logs .#local-git-branch-cleanup .#local-git-branch-cleanup-tui

  # The jobs above run on x86_64 Linux through Nix. Release binaries also target macOS, Windows and
  # Linux ARM, where the Nix dev shell is not available, so the tests run there with rustup and
  # rust-toolchain.toml (kept equal to the flake's rustc by the lint job).
  test-native:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust tests
        run: cargo test -p local-git-branch-cleanup-tui --all-features

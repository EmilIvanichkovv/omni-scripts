[package]
name = "worktrack"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TUI that tracks unfinished work across repos, worktrees, PRs, Claude Code sessions and todos"
repository = "https://github.com/EmilIvanichkovv/omni-scripts"
homepage = "https://github.com/EmilIvanichkovv/omni-scripts/tree/main/rust/worktrack"
readme = "README.md"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap.workspace = true
color-eyre.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
rusqlite.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["io-util", "fs"] }
async-trait.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
url.workspace = true
toml.workspace = true
sha2.workspace = true
ulid.workspace = true
regex.workspace = true
globset.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
shell-words.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
wiremock.workspace = true
proptest.workspace = true
insta.workspace = true
